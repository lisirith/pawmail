<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pawmail</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 舞台 = 整个透明窗口。宠物、气泡、菜单都在里面 -->
    <div id="stage">
      <!-- 活动范围：宠物只在这个框里活动，框外面的部分看不见（没设置时就是整个窗口） -->
      <!-- toy：桌面上滚来滚去的玩具（猫的毛线球、柴犬的网球），会滚得离宠物很远，所以单独一块小画布 -->
      <!-- play-ground：陪兔子跳栏杆时地上的栏杆（贴着地面的一条）；play-cursor：陪它玩时跟着鼠标的道具（逗猫棒、树枝……） -->
      <div id="arena"><canvas id="play-ground" hidden></canvas><canvas id="pet"></canvas><canvas id="toy" hidden></canvas></div>
      <!-- 拖着文件到它身上时，跟在鼠标旁边的小纸团（代替 Windows 那个挡脸的大图标） -->
      <canvas id="food-cursor" hidden></canvas>
      <canvas id="play-cursor" hidden></canvas>
      <div id="bubble" class="bubble"><span class="bubble-text"></span></div>
      <div id="menu" class="menu" hidden></div>
      <!-- 画活动范围时才出现 -->
      <div id="area-editor" hidden></div>
      <pre id="hud" hidden></pre>
    </div>
    <!-- 只在浏览器预览时显示的假任务栏 -->
    <div id="fake-taskbar"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
